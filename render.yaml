services:
  - type: web
    name: manishas-kitchen
    runtime: node
    plan: free
    buildCommand: npm --prefix server install --legacy-peer-deps && npm --prefix client install --legacy-peer-deps && npm --prefix client run build:only && npm --prefix server run build
    startCommand: npm --prefix server run deploy && npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CI
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: manishas-kitchen-db
          property: connectionString
      - key: MSG91_WHATSAPP_AUTHKEY
        sync: false
      - key: MSG91_WHATSAPP_SENDER_NUMBER
        sync: false
      - key: MSG91_WHATSAPP_TEMPLATE_NAMESPACE
        sync: false
      - key: MSG91_WHATSAPP_ORDER_TEMPLATE
        value: order_confirmation
      - key: MSG91_WEBHOOK_SECRET
        sync: false
      - key: MSG91_WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: OTP_PROVIDER
        sync: false
      - key: MSG91_AUTHKEY
        sync: false
      - key: MSG91_WIDGET_ID
        sync: false
      - key: MSG91_TOKEN_AUTH
        sync: false

databases:
  - name: manishas-kitchen-db
    databaseName: manishas_kitchen
    plan: free
