services:
  - type: web
    name: manishas-kitchen-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: manishas-kitchen-db
          property: connectionString

databases:
  - name: manishas-kitchen-db
    databaseName: spice_restaurant
    plan: free
